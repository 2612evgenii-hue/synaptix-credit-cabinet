name: Ошибка
description: Воспроизводимая проблема
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: SHA или тег
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое и фактическое поведение
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Окружение и логи без секретов
